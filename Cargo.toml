[package]
name = "news-scout"
version = "0.2.0"
edition = "2024"

[dependencies]
grammers-client = "0.9"
grammers-session = "0.9"
grammers-mtsender = "0.9"
grammers-tl-types = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
qr2term = "0.3"
rpassword = "7.3"
base64 = "0.22"
base64-url = "3.0"
reqwest = { version = "0.13.2", features = ["json"] }
rig = { package = "rig-core", version = "0.30.0" }
libsql = "0.9.30"
rand = "0.9.2"
env_logger = "0.11.8"
anyhow = "1.0.101"
futures = "0.3"
sentry = "0.46.2"
serde_json = "1.0.149"
regex = "1"

[profile.release]
strip = "symbols"
