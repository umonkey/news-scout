# Runs static analysis and tests for news-scout.
#
# This workflow runs on pushes and pull requests that modify the crate at the
# repository root, excluding the default branch (main).

name: Check News Scout

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
  pull_request:
    branches-ignore: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'

jobs:
  check:
    name: "Check news-scout"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Install dependencies"
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libsqlite3-dev
          version: 1.0

      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: "Rust Cache"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: "Run checks"
        run: make check
