name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-news-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push news-scout image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/umonkey/news-scout:latest
          platforms: linux/amd64
          # mode=max is required so the dependency-build layer in the builder
          # stage is exported; a registry cache avoids the 10 GB GHA cap.
          cache-from: type=registry,ref=ghcr.io/umonkey/news-scout:buildcache
          cache-to: type=registry,ref=ghcr.io/umonkey/news-scout:buildcache,mode=max,ignore-error=true
